- [Render MySQL Docs](https://render.com/docs/databases)- [Documentação oficial Render - Java](https://render.com/docs/deploy-spring-boot)## Recursos Adicionais- [ ] Endpoint de teste respondendo (ex: `/actuator/health`)- [ ] Logs sem erros de conexão- [ ] Deploy executado com sucesso- [ ] Start command: `java -jar target/backend-0.0.1-SNAPSHOT.jar`- [ ] Build command: `./mvnw clean package -DskipTests`- [ ] Todas as variáveis de ambiente configuradas- [ ] Web Service configurado com Java- [ ] Banco MySQL criado no Render## Checklist Final```CORS_ORIGINS=https://seu-frontend.render.com,http://localhost:3000```bashE configure a variável de ambiente:```spring.web.cors.allow-credentials=truespring.web.cors.allowed-headers=*spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONSspring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}# CORS Configuration```propertiesSe o frontend estiver em outro domínio, adicione ao `application.properties`:## Configuração de CORS (se necessário)- **Health Check**: Configure em Settings → Health Check Path: `/actuator/health`- **Métricas**: Disponíveis no Dashboard do Render- **Logs em tempo real**: `render logs --tail`### 7. Monitoramento2. Clique em **Manual Deploy** → **Deploy latest commit**1. Vá no Dashboard do seu Web Service**Para forçar rebuild:**O Render detecta automaticamente mudanças no branch `main` e faz o deploy.### 6. Build e Deploy- Considere mudar `spring.jpa.hibernate.ddl-auto=update` para `validate` após primeira inicialização- Verifique se está usando o **MySQL persistente** (não o gratuito temporário)#### O banco reseta após deploy```SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT=5000SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=60000```bashAumente os timeouts nas variáveis de ambiente:#### Erro: "Connection timeout"```mysql -h <DB_HOST> -P 3306 -u <DB_USER> -p<DB_PASSWORD> <DB_NAME> --ssl-mode=REQUIRED```bash**Teste a conexão localmente:**```render logs```bash**Verificar logs:**4. **Banco não criado**: Confirme que o database existe no MySQL3. **Firewall**: O MySQL do Render deve permitir conexões do backend2. **SSL obrigatório**: Certifique-se que `DB_USE_SSL=true`1. **Credenciais incorretas**: Verifique se todas as variáveis de ambiente estão corretas**Causas possíveis:**#### Erro: "Unable to open JDBC Connection"### 5. Troubleshooting- `DB_NAME`: `pi_reinados_web`- `DB_PASSWORD`: `abc123def456`- `DB_USER`: `root`- `DB_PORT`: `3306`- `DB_HOST`: `dpg-xyz123.oregon-postgres.render.com`Extraia:```mysql://root:abc123def456@dpg-xyz123.oregon-postgres.render.com/pi_reinados_web```**Exemplo:**- **Database**: A parte após a última `/`- **Password**: A parte entre `:` (após user) e `@`- **User**: A parte entre `://` e `:`- **Port**: Geralmente `3306`- **Host**: A parte entre `@` e o primeiro `:`Se você tiver o **Internal Database URL** do Render (formato: `mysql://user:password@host:port/database`), extraia:### 4. Formato da Connection String```SPRING_PROFILES_ACTIVE=production# Profile do Spring (opcional)SHOW_SQL=falseSQL_LOG_LEVEL=WARNLOG_LEVEL=INFO# Logging (opcional - reduz logs em produção)DB_USE_SSL=trueDB_PASSWORD=<sua-senha-mysql>DB_USER=rootDB_NAME=pi_reinados_webDB_PORT=3306DB_HOST=<seu-mysql-host>.render.com# mysql://user:password@host:port/database# Use o Internal Database URL do seu MySQL no formato:# Configurações do Banco de DadosPORT=10000# Porta (Render injeta automaticamente)```bashNo painel do Web Service, vá em **Environment** e adicione:### 3. Configurar Variáveis de Ambiente     ```     java -jar target/backend-0.0.1-SNAPSHOT.jar     ```bash   - **Start Command**:     ```     ./mvnw clean package -DskipTests     ```bash   - **Build Command**:    - **Runtime**: `Java`   - **Root Directory**: `backend`   - **Branch**: `main`   - **Region**: Mesma do banco de dados   - **Name**: `pi-reinados-backend`3. Configure:2. Conecte seu repositório GitHub1. No Render Dashboard, clique em **New +** → **Web Service**### 2. Criar o serviço Web (Backend Spring Boot)3. Anote as credenciais geradas (Internal Database URL)   - **Region**: Escolha a mesma região do backend   - **User**: `root` (ou crie um usuário específico)   - **Database**: `pi_reinados_web`   - **Name**: `pi-reinados-mysql` (ou nome de sua escolha)2. Configure:1. No Render Dashboard, clique em **New +** → **MySQL**### 1. Criar o serviço MySQL## Configuração do Banco de Dados MySQL no Render# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:pi_reinados_web}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=60000&socketTimeout=60000&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:projeto#Integrador123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Logging Configuration
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.com.zaxxer.hikari=INFO

# Jackson Configuration
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Server Configuration
server.port=${PORT:8080}
server.tomcat.connection-timeout=60000
server.tomcat.max-threads=200